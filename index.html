<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stars for Impact · inDrive hackathon demo</title>
<meta name="description" content="Rate any ride, and inDrive gives S/ 1 to help women in Peru get a driving licence. Clickable prototype by Team Lucky Stars.">
<meta name="theme-color" content="#C1F11D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C1F11D'/%3E%3Cpath d='M32 14l5.3 10.9 12 1.7-8.7 8.5 2 12-10.6-5.6-10.6 5.6 2-12-8.7-8.5 12-1.7z' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>/* Stars for Impact — public demo. Light theme, iOS-like metrics (1 CSS px = 1 pt). */
:root {
  --lime: #C1F11D; --lime-press: #AEDC0C; --lime-ink: #191F05; --lime-tint: #F4FADF; --lime-line: #E2F1A8; --lime-deep: #6E8F00;
  --ink: #111111; --text: #1C1C1E; --text-2: #6C6C70; --text-3: #A0A0A5;
  --bg: #FFFFFF; --fill: #F2F1ED; --fill-2: #F7F6F2; --gap: #F2F3ED; --line: #E5E6E1; --icon: #8F9299;
  --star: #FFC13C; --star-off: #DCDCD8; --route: #2F7BF5; --red: #F0473D; --green: #2DB55D; --snack: #2B2F33;
  --r-sheet: 24px; --r-card: 20px; --r-btn: 12px;
  --e-out: cubic-bezier(.2, .8, .2, 1); --e-spring: cubic-bezier(.3, 1.3, .5, 1); --e-in: cubic-bezier(.5, 0, .75, 0);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: 54px; --safe-bot: 30px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
body { font-family: var(--font); color: var(--text); background: #EDECE7; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; line-height: 1.3; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
textarea { font: inherit; }
img { display: block; }
.ic { display: block; flex: none; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ================= SHELL ================= */
#root { position: fixed; inset: 0; }
.bg-glow { position: absolute; inset: 0; pointer-events: none; background:
  radial-gradient(600px 420px at 72% 48%, rgba(193, 241, 29, .28), transparent 70%),
  radial-gradient(500px 380px at 18% 90%, rgba(193, 241, 29, .10), transparent 70%), #EDECE7; }

/* cover */
.cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 72px; padding: 32px 48px; transition: opacity .45s var(--e-out), transform .45s var(--e-out); }
.cover.out { opacity: 0; transform: translateY(-12px); pointer-events: none; }
.cv-text { max-width: 520px; position: relative; z-index: 2; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: #55575C; font-weight: 500; }
.brand-logo { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--ink); font-size: 17px; letter-spacing: -.3px; }
.brand-logo i { width: 20px; height: 20px; border-radius: 6px; background: var(--lime); display: inline-grid; place-items: center; }
.brand-logo i:after { content: ''; width: 8px; height: 8px; background: var(--ink); border-radius: 2px; transform: rotate(45deg); }
.brand-sep { width: 4px; height: 4px; border-radius: 50%; background: #B9BAB4; }
.cv-h1 { font-size: 76px; line-height: .96; letter-spacing: -3px; font-weight: 800; color: var(--ink); margin: 26px 0 18px; }
.cv-h1 span { position: relative; white-space: nowrap; }
.cv-h1 span:before { content: ''; position: absolute; left: -4px; right: -6px; bottom: 6px; height: 26px; background: var(--lime); z-index: -1; border-radius: 6px; transform: skewX(-8deg); }
.cv-sub { font-size: 21px; line-height: 1.38; color: #3A3C40; max-width: 460px; }
.cv-sub b { color: var(--ink); font-weight: 700; }
.cv-cta { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 30px 0 32px; border-radius: 18px; background: var(--ink); color: #fff; font-size: 19px; font-weight: 700; box-shadow: 0 12px 30px rgba(17, 17, 17, .22); transition: transform .15s var(--e-out), box-shadow .15s; }
.cv-cta:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(17, 17, 17, .28); }
.cv-cta:active { transform: scale(.97); }
.cv-cta .arr { width: 30px; height: 30px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
.cv-meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
.cv-meta span { font-size: 13px; font-weight: 600; color: #4A4C50; background: rgba(255, 255, 255, .7); border-radius: 999px; padding: 6px 11px; }
.cv-foot { position: absolute; left: 48px; bottom: 22px; font-size: 12px; color: #8A8B86; }
.cv-qr { position: absolute; right: 36px; bottom: 26px; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 10px 14px 10px 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .06); }
.cv-qr canvas, .cv-qr svg { width: 74px; height: 74px; display: block; }
.cv-qr b { display: block; font-size: 13px; color: var(--ink); }
.cv-qr small { font-size: 12px; color: var(--text-2); }
.cv-phone { position: relative; z-index: 1; }
.cv-badge { position: absolute; z-index: 3; }

/* demo layout */
.demo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 24px 40px; opacity: 0; pointer-events: none; transition: opacity .45s var(--e-out); }
.demo.on { opacity: 1; pointer-events: auto; }
.panel { width: 340px; flex: none; align-self: center; display: flex; flex-direction: column; gap: 22px; }
.pn-top { display: flex; flex-direction: column; gap: 10px; }
.pn-title { font-size: 30px; font-weight: 800; letter-spacing: -1px; color: var(--ink); line-height: 1; }
.pn-card { background: #fff; border-radius: 22px; padding: 20px 20px 18px; box-shadow: 0 8px 28px rgba(0, 0, 0, .05); }
.pn-kick { font-size: 12px; font-weight: 700; color: var(--lime-deep); text-transform: uppercase; letter-spacing: .08em; }
.pn-h { font-size: 22px; font-weight: 800; letter-spacing: -.5px; color: var(--ink); line-height: 1.15; margin: 8px 0 8px; }
.pn-p { font-size: 15px; color: #4A4C52; line-height: 1.42; }
.pn-do { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--lime-tint); border: 1px solid var(--lime-line); border-radius: 999px; padding: 7px 12px 7px 9px; }
.pn-do i { width: 22px; height: 22px; border-radius: 50%; background: var(--lime); display: grid; place-items: center; }
.pn-ch { display: flex; flex-direction: column; gap: 2px; }
.pn-ch button { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 14px; transition: background .15s; }
.pn-ch button:hover { background: rgba(255, 255, 255, .6); }
.pn-ch .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: #E1E0DA; color: #6A6B66; flex: none; }
.pn-ch .t { font-size: 15px; font-weight: 600; color: #55575C; }
.pn-ch .t small { display: block; font-size: 12.5px; font-weight: 500; color: #8A8B86; margin-top: 1px; }
.pn-ch .on .n { background: var(--ink); color: var(--lime); }
.pn-ch .on .t { color: var(--ink); }
.pn-ch .done .n { background: var(--lime); color: var(--ink); }
.pn-ctl { display: flex; gap: 8px; }
.pn-ctl button { height: 44px; border-radius: 14px; padding: 0 16px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .04); }
.pn-ctl .next { background: var(--ink); color: #fff; margin-left: auto; }
.pn-ctl button:disabled { opacity: .35; cursor: default; }
.pn-foot { font-size: 12px; color: #8A8B86; line-height: 1.45; }

/* device */
.stage { position: relative; flex: none; }
.device { position: relative; width: 417px; height: 876px; border-radius: 68px; background: #0C0C0D; padding: 12px; box-shadow: 0 0 0 2px #2A2A2C inset, 0 40px 80px rgba(20, 22, 18, .25), 0 12px 24px rgba(20, 22, 18, .12); transform-origin: center center; }
.device:before { content: ''; position: absolute; right: -3px; top: 190px; width: 3px; height: 92px; border-radius: 0 2px 2px 0; background: #1E1E20; }
.island { position: absolute; z-index: 60; left: 50%; top: 23px; width: 124px; height: 36px; border-radius: 20px; background: #000; transform: translateX(-50%); pointer-events: none; }
.screen { position: relative; width: 393px; height: 852px; border-radius: 56px; overflow: hidden; background: #fff; isolation: isolate; }
.statusbar { position: absolute; z-index: 55; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 52px; font-size: 17px; font-weight: 600; color: #000; pointer-events: none; transition: color .3s; }
.statusbar.dark { color: #fff; }
.sb-r { display: flex; align-items: center; gap: 6px; }
.homebar { position: absolute; z-index: 56; left: 50%; bottom: 8px; width: 140px; height: 5px; border-radius: 3px; background: #000; transform: translateX(-50%); pointer-events: none; transition: background .3s; }
.homebar.light { background: #fff; }

/* mobile: the app fills the viewport, demo bar on top */
.mobile .cover { flex-direction: column; justify-content: flex-start; gap: 0; padding: 22px 22px 0; overflow-y: auto; align-items: stretch; }
.mobile .cv-text { max-width: none; }
.mobile .cv-h1 { font-size: 50px; letter-spacing: -2px; margin: 18px 0 14px; }
.mobile .cv-h1 span:before { height: 18px; bottom: 4px; }
.mobile .cv-sub { font-size: 18px; }
.mobile .cv-cta { width: 100%; justify-content: center; height: 58px; margin-top: 22px; }
.mobile .cv-meta { justify-content: center; }
.mobile .cv-phone { margin: 26px auto 0; height: 300px; overflow: hidden; width: 100%; display: flex; justify-content: center; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.mobile .cv-foot { position: static; text-align: center; padding: 6px 0 18px; }
.mobile .cv-qr { display: none; }
.mobile .demo { padding: 0; gap: 0; flex-direction: column; align-items: stretch; justify-content: flex-start; }
.mobile .panel { display: none; }
.mobile .stage { flex: 1; min-height: 0; }
.mobile .device { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; background: #fff; transform: none !important; }
.mobile .device:before, .mobile .island, .mobile .statusbar, .mobile .homebar { display: none; }
.mobile .screen { width: 100%; height: 100%; border-radius: 0; }
.mobile { --safe-top: 10px; --safe-bot: max(14px, env(safe-area-inset-bottom)); }

.mbar { display: none; }
.mobile .mbar { display: flex; flex: none; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 14px; background: #111; color: #fff; z-index: 80; }
.mbar-dots { display: flex; gap: 4px; }
.mbar-dots i { width: 18px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); transition: background .3s, width .3s; }
.mbar-dots i.on { background: var(--lime); width: 26px; }
.mbar-dots i.done { background: rgba(193, 241, 29, .55); }
.mbar-t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar-t small { color: rgba(255, 255, 255, .55); font-weight: 500; margin-right: 6px; }
.mbar button { height: 32px; min-width: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 9px; font-size: 13px; font-weight: 700; background: rgba(255, 255, 255, .1); }
.mbar .mb-next { background: var(--lime); color: var(--ink); }

/* chapters sheet (mobile) */
.chap-sheet { position: absolute; z-index: 90; inset: 0; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-start; animation: fadeIn .2s var(--e-out); }
.chap-card { width: 100%; background: #fff; border-radius: 0 0 24px 24px; padding: 14px 14px 18px; animation: dropIn .3s var(--e-out); }
.chap-card h4 { font-size: 13px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px 8px; }
.chap-card .pn-ch .t { color: var(--ink); }
.chap-card .row2 { display: flex; gap: 8px; margin-top: 10px; padding: 0 4px; }
.chap-card .row2 button { flex: 1; height: 46px; border-radius: 14px; background: var(--fill); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

/* ================= LAYERS ================= */
.layer { position: absolute; inset: 0; }
#lyBase, #lyPage, #lyOverlay, #lyToast, #lyHint, #lyFx { pointer-events: none; }
#lyBase > *, #lyPage > *, #lyOverlay > *, #lyToast > * { pointer-events: auto; }
#lyMap { z-index: 1; overflow: hidden; background: #F3F3F1; }
#lyBase { z-index: 5; }
#lyPage { z-index: 20; }
#lyOverlay { z-index: 30; }
#lyToast { z-index: 40; }
#lyFx { z-index: 45; }
#lyHint { z-index: 50; }

/* ================= MAP ================= */
.map-cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.map-cam.anim { transition: transform 1.1s var(--e-out); }
.map-cam svg { display: block; }
.map-over { position: absolute; left: 0; top: 0; overflow: visible; }
.rt-casing { fill: none; stroke: #1D5ED8; stroke-linecap: round; stroke-linejoin: round; stroke-width: 8; }
.rt-line { fill: none; stroke: var(--route); stroke-linecap: round; stroke-linejoin: round; stroke-width: 5.5; }
.rt-done { fill: none; stroke: #9DB8E6; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5.5; }
.mk { position: absolute; left: 0; top: 0; pointer-events: none; }
.mk-pick { width: 34px; height: 64px; margin: -64px 0 0 -17px; display: flex; flex-direction: column; align-items: center; }
.mk-pick .sq { width: 34px; height: 34px; border-radius: 10px; background: #111; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0, 0, 0, .25); }
.mk-pick .st { width: 2.5px; height: 18px; background: #111; }
.mk-pick .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--route); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); margin-top: -4px; }
.mk-me { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--route); border: 4px solid #fff; box-shadow: 0 0 0 8px rgba(47, 123, 245, .16), 0 1px 4px rgba(0, 0, 0, .3); }
.mk-dest { margin: -11px 0 0 -11px; }
.mk-dest .ring { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 6px solid var(--route); box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.mk-dest .lbl { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); white-space: nowrap; background: var(--route); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; box-shadow: 0 3px 10px rgba(47, 123, 245, .35); }
.mk-dest .lbl:after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: var(--route); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.mk-start { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; border: 4px solid var(--green); }
.mk-car { width: 46px; height: 46px; margin: -23px 0 0 -23px; transition: none; }
.mk-car svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .28)); }

/* ================= COMMON UI ================= */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: var(--r-btn); font-size: 17px; font-weight: 600; transition: transform .12s var(--e-out), background .15s, opacity .2s; user-select: none; }
.btn:active { transform: scale(.98); }
.btn-lime { background: var(--lime); color: var(--lime-ink); }
.btn-lime:active { background: var(--lime-press); }
.btn-gray { background: var(--fill); color: var(--ink); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-white { background: #fff; color: var(--ink); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.round-btn { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .14); color: #111; }
.x-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: #2A2A2C; }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: #D8D7D2; margin: 8px auto 0; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); animation: fadeIn .28s var(--e-out); }
.scrim.out { animation: fadeOut .25s var(--e-in) forwards; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: var(--r-sheet) var(--r-sheet) 0 0; animation: sheetUp .42s var(--e-out); padding-bottom: var(--safe-bot); }
.sheet.out { animation: sheetDown .26s var(--e-in) forwards; }
.sheet.noanim { animation: none; }
.chev { color: #B5B6B1; }
.avatar { border-radius: 50%; object-fit: cover; background: #E3E2DD; }
.stars { display: flex; justify-content: center; gap: 10px; }
.star { width: 44px; height: 44px; display: grid; place-items: center; transition: transform .18s var(--e-spring); }
.star svg { width: 100%; height: 100%; }
.star path { fill: var(--star-off); stroke: var(--star-off); transition: fill .15s, stroke .15s; }
.star.on path { fill: var(--star); stroke: var(--star); }
.star.pop { animation: starPop .38s var(--e-spring); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--fill); font-size: 15px; color: var(--ink); display: inline-flex; align-items: center; transition: background .15s, transform .12s, box-shadow .15s; }
.chip:active { transform: scale(.96); }
.chip.on { background: var(--ink); color: #fff; }
.snack { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-bot) + 12px); background: var(--snack); color: #fff; border-radius: 16px; padding: 13px 14px 13px 13px; display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.32; box-shadow: 0 10px 28px rgba(0, 0, 0, .28); animation: snackIn .42s var(--e-out); }
.snack.out { animation: snackOut .3s var(--e-in) forwards; }
.snack .ok { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--snack); display: grid; place-items: center; flex: none; }
.snack .ok.lime { background: var(--lime); color: var(--ink); }
.snack b { font-weight: 600; }
.snack small { display: block; color: rgba(255, 255, 255, .72); font-size: 13.5px; margin-top: 1px; }
.snack.err { background: #2B2F33; }

/* impact components */
.imp-tease { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--lime-tint); border: 1px solid var(--lime-line); text-align: left; }
.imp-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; flex: none; }
.imp-tease b { display: block; font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -.1px; }
.imp-tease span { display: block; font-size: 13px; color: #4F5627; margin-top: 2px; line-height: 1.3; }
.imp-tease.glow { animation: teaseGlow 2.4s ease-in-out 2; }
.imp-mini { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4F6A00; }
.imp-mini i { width: 18px; height: 18px; border-radius: 50%; background: var(--lime); color: var(--ink); display: grid; place-items: center; }
.prog { text-align: left; padding: 12px 14px 12px; border-radius: 16px; background: var(--lime-tint); border: 1px solid var(--lime-line); }
.prog-top { display: flex; align-items: center; gap: 10px; }
.prog-top .imp-ic { width: 30px; height: 30px; }
.prog-top b { flex: 1; font-size: 14.5px; font-weight: 700; color: var(--ink); line-height: 1.25; }
.prog-top .cnt { font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.segs { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
.seg { flex: 1; height: 8px; border-radius: 4px; background: rgba(110, 143, 0, .16); overflow: hidden; position: relative; }
.seg i { position: absolute; inset: 0; background: var(--lime-deep); border-radius: 4px; transform: scaleX(0); transform-origin: left; transition: transform .55s var(--e-out); }
.seg.on i { transform: scaleX(1); }
.seg-gift { width: 30px; height: 30px; margin-left: 4px; border-radius: 10px; background: #fff; border: 1px solid var(--lime-line); display: grid; place-items: center; color: var(--lime-deep); flex: none; transition: background .3s, color .3s, transform .3s var(--e-spring); }
.seg-gift.open { background: var(--lime); color: var(--ink); transform: scale(1.12) rotate(-6deg); }
.prog-sub { margin-top: 7px; font-size: 12.5px; color: #59612F; }
.prog-sub b { color: var(--ink); }
.bar { height: 10px; border-radius: 5px; background: rgba(17, 17, 17, .08); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--ink); width: 0; transition: width 1s var(--e-out); }
.bar.lime i { background: var(--lime); }

/* coin + fx */
.coin { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--lime); color: var(--ink); font-weight: 800; font-size: 13px; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(110, 143, 0, .45), inset 0 -3px 0 rgba(0, 0, 0, .12); letter-spacing: -.3px; }
.plus { position: absolute; font-weight: 800; font-size: 15px; color: var(--lime-deep); pointer-events: none; animation: plusUp 1s var(--e-out) forwards; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: confFall linear forwards; }
.burst { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none; }
.burst i { position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--lime-deep); animation: burst .7s var(--e-out) forwards; }

/* hints */
.hint-ring { position: absolute; border-radius: 18px; pointer-events: none; box-shadow: 0 0 0 3px var(--lime), 0 0 0 7px rgba(193, 241, 29, .35); animation: ringPulse 1.6s ease-in-out infinite; transition: left .3s, top .3s, width .3s, height .3s; }
.hint-hand { position: absolute; width: 44px; height: 44px; pointer-events: none; animation: handTap 1.6s ease-in-out infinite; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .3)); }
.hint-tip { position: absolute; max-width: 250px; background: #111; color: #fff; font-size: 14px; font-weight: 600; line-height: 1.3; padding: 10px 13px; border-radius: 14px; pointer-events: none; animation: tipIn .3s var(--e-out); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.hint-tip:after { content: ''; position: absolute; left: var(--ax, 50%); width: 12px; height: 12px; background: #111; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.hint-tip.up:after { bottom: -5px; }
.hint-tip.down:after { top: -5px; }
.nudge { position: absolute; background: rgba(17, 17, 17, .88); color: #fff; font-size: 13px; font-weight: 600; padding: 7px 11px; border-radius: 12px; pointer-events: none; white-space: nowrap; animation: nudge 1.6s var(--e-out) forwards; }

/* ================= HOME ================= */
.home-top { position: absolute; left: 0; right: 0; top: calc(var(--safe-top) + 6px); height: 48px; }
.home-top .menu { position: absolute; left: 16px; top: 2px; }
.pickup { position: absolute; left: 50%; top: 0; transform: translateX(-50%); background: #fff; border-radius: 14px; padding: 7px 34px 8px 14px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); white-space: nowrap; }
.pickup small { display: block; font-size: 12.5px; color: #8A8A8E; }
.pickup b { display: block; font-size: 15px; font-weight: 600; color: #000; margin-top: 1px; }
.pickup .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #111; }
.home-locate { position: absolute; right: 16px; }
.home-panel { position: absolute; left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.home-panel::-webkit-scrollbar { display: none; }
.hp-card { background: #fff; border-radius: 24px; }
.hp-card + .hp-card { margin-top: 8px; }
.hp-first { padding: 0 16px 6px; border-radius: 24px 24px 24px 24px; box-shadow: 0 -4px 20px rgba(0, 0, 0, .08); }
.hp-search { margin-top: 14px; height: 54px; border-radius: 16px; background: var(--fill); display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 19px; font-weight: 600; color: #111; letter-spacing: -.2px; }
.hp-recent { display: flex; align-items: center; gap: 14px; height: 52px; font-size: 16.5px; color: #111; padding-left: 2px; }
.hp-recent .ic { color: #8F9299; }
.hp-recent + .hp-recent { border-top: 0; }
.hp-panel-bg { background: var(--gap); padding-bottom: 30px; }
.svc { padding: 14px 14px 18px; }
.svc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.svc-big { grid-row: span 2; height: 152px; }
.svc-right { display: grid; grid-template-rows: 72px 72px; gap: 8px; }
.svc-small2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { position: relative; border-radius: 16px; background: var(--fill); overflow: hidden; font-size: 15px; color: #111; padding: 11px 12px; text-align: left; }
.tile .art { position: absolute; pointer-events: none; }
.svc-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
.svc-row .it { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: #111; text-align: center; }
.svc-row .sq { width: 58px; height: 58px; border-radius: 16px; background: var(--fill); display: grid; place-items: center; font-size: 30px; overflow: hidden; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; font-size: 21px; font-weight: 700; color: #111; letter-spacing: -.4px; }
.sec-h .em { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-size: 19px; }
.sec-h .go { width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; }
.food { display: flex; gap: 8px; padding: 0 16px 16px; overflow: hidden; }
.food .f { flex: none; width: 78px; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; color: #111; }
.food .f .im { height: 62px; border-radius: 14px; background: var(--fill); display: grid; place-items: center; font-size: 34px; }

/* ================= SIDE MENU ================= */
.dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); animation: fadeIn .25s var(--e-out); }
.dim.out { animation: fadeOut .22s var(--e-in) forwards; }
.drawer { position: absolute; left: 0; top: 0; bottom: 0; width: 80%; max-width: 330px; background: #fff; display: flex; flex-direction: column; padding-top: calc(var(--safe-top) + 6px); animation: drawerIn .34s var(--e-out); box-shadow: 8px 0 30px rgba(0, 0, 0, .12); }

.dr-prof { display: flex; align-items: center; gap: 14px; padding: 10px 16px 16px 18px; border-bottom: 1px solid var(--line); }
.dr-prof .av { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #D9D2C5, #B8AE9C); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 21px; flex: none; }

/* ================= RIDE ================= */
.ride-top { position: absolute; top: calc(var(--safe-top) + 6px); left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }

.safety-pill { height: 40px; border-radius: 20px; background: #fff; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 10px; font-size: 15px; font-weight: 600; box-shadow: 0 2px 8px rgba(0, 0, 0, .14); color: #111; }

.ride-panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(0, 0, 0, .1); overflow-y: auto; scrollbar-width: none; }
.ride-panel::-webkit-scrollbar { display: none; }
.rp-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px; }
.rp-head .l { flex: 1; min-width: 0; }
.rp-head h2 { font-size: 21px; font-weight: 700; color: #111; letter-spacing: -.4px; }
.rp-head p { font-size: 15px; color: #3A3A3C; margin-top: 3px; }
.rp-car { position: relative; width: 112px; height: 62px; flex: none; }
.rp-car svg { position: absolute; left: 0; top: 0; }
.plate { position: absolute; right: 2px; bottom: -4px; background: #EFEFEC; border: 1px solid #DADAD5; color: #111; font-weight: 700; font-size: 14px; border-radius: 7px; padding: 2px 8px; letter-spacing: .4px; }
.rp-acts { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 6px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.rp-act { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 14px; color: #111; }
.rp-act .ph { position: relative; width: 52px; height: 52px; }

.rp-act .ph .r { position: absolute; right: -16px; top: -4px; background: #fff; border-radius: 9px; padding: 2px 5px; font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 2px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }

.rate-block { padding: 16px 16px 14px; text-align: center; border-bottom: 1px solid var(--line); }

.arrived-chip { position: absolute; left: 50%; top: calc(var(--safe-top) + 8px); transform: translateX(-50%); background: #111; color: #fff; border-radius: 20px; padding: 9px 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); animation: dropIn .4s var(--e-out); white-space: nowrap; }

/* ================= RATING SHEET ================= */
.rate-sheet { padding: 14px 20px calc(var(--safe-bot) + 10px); text-align: center; max-height: calc(100% - 40px); overflow-y: auto; scrollbar-width: none; }

.rate-sheet .stars { margin: 16px 0 14px; gap: 12px; }

.rs-anon { font-size: 13px; color: #8A8A8E; margin-top: 10px; }
.rs-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--e-out); }

.rs-send { margin-top: 0; }
.rs-dock { position: sticky; bottom: calc(-1 * (var(--safe-bot) + 10px)); margin: 16px -20px calc(-1 * (var(--safe-bot) + 10px)); padding: 12px 20px calc(var(--safe-bot) + 10px); background: #fff; z-index: 2; }

/* ================= PAGES ================= */
.page { position: absolute; inset: 0; background: #fff; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; animation: pageIn .42s var(--e-out); }
.page::-webkit-scrollbar { display: none; }

.pg-nav { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; height: calc(var(--safe-top) + 50px); padding: var(--safe-top) 12px 0; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

.ty-head { display: flex; align-items: flex-start; gap: 12px; margin: 6px 0 18px; }

.ty-badge { width: 64px; height: 64px; flex: none; animation: badgeIn .7s var(--e-spring); }
.ty-safety { display: flex; align-items: center; gap: 10px; background: #F4F6FB; border-radius: 14px; padding: 11px 13px; font-size: 14px; color: #2B3A55; margin-bottom: 14px; }

.ty-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--safe-bot) + 10px); background: linear-gradient(rgba(255, 255, 255, 0), #fff 30%); }
.ty-wrap { position: absolute; inset: 0; }
.impact-card { border-radius: 22px; background: var(--lime); color: var(--ink); padding: 16px; position: relative; overflow: hidden; animation: cardIn .55s var(--e-out) .1s both; }
.impact-card .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; background: rgba(17, 17, 17, .08); border-radius: 999px; padding: 5px 10px; }

.impact-card .photo { width: 100%; height: 150px; border-radius: 16px; object-fit: cover; margin-top: 14px; }
.ic-inner { background: rgba(255, 255, 255, .55); border-radius: 16px; padding: 12px 13px; margin-top: 12px; }
.ic-row { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 600; color: #2F3A08; }

.impact-card .segs .seg { background: rgba(17, 17, 17, .1); }

.impact-card .bar { background: rgba(17, 17, 17, .1); margin-top: 8px; }
.impact-card .link { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; height: 46px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 600; padding: 0 14px 0 16px; }
.ty-more { margin-top: 18px; }

.promo { display: flex; align-items: center; gap: 12px; background: var(--fill); border-radius: 18px; padding: 12px 14px; }
.promo .em { width: 48px; height: 48px; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 26px; flex: none; }

.promo small { font-size: 13px; color: #6C6C70; }

/* story */
.story { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--safe-top) + 4px); background: #121417; color: #fff; border-radius: 26px 26px 0 0; overflow: hidden; display: flex; flex-direction: column; animation: sheetUp .5s var(--e-out); }

.st-bars { display: flex; gap: 5px; padding: 12px 14px 0; position: relative; z-index: 3; }

.st-kick { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: var(--lime); color: var(--ink); font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 5px 10px; margin-top: 4px; letter-spacing: .02em; }

.st-goal { margin-top: 22px; background: rgba(255, 255, 255, .07); border-radius: 20px; padding: 16px; }
.st-goal .r1 { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: rgba(255, 255, 255, .7); }
.st-goal .big { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.8px; }
.st-goal .bar { background: rgba(255, 255, 255, .12); margin-top: 10px; height: 12px; border-radius: 6px; }

.rp-car svg { width: 104px; height: auto; }
/* map like prod: black route */
.rt-casing { stroke: #FFFFFF; stroke-width: 7; }
.rt-line { stroke: #121212; stroke-width: 4; }
.mk-dest .ring { width: 28px; height: 28px; border-radius: 8px; background: #121212; border: 0; display: grid; place-items: center; margin: -3px 0 0 -3px; }
.mk-dest .ring:after { content: ''; width: 10px; height: 12px; background: linear-gradient(#fff, #fff) left top / 2px 12px no-repeat, linear-gradient(#fff, #fff) 2px 0 / 8px 7px no-repeat; }
.mk-dest .lbl { background: #121212; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
.mk-dest .lbl:after { background: #121212; }
/* home metrics */
.home-top .menu, .home-locate { width: 48px; height: 48px; }
.home-top .menu { left: 8px; top: 0; }
.home-locate { right: 8px; }
.pickup { top: 4px; border-radius: 13px; padding: 5px 30px 6px 10px; }
.pickup small { font-size: 12px; color: #686868; }
.pickup b { font-size: 14.5px; font-weight: 500; color: #121210; }
.home-panel { top: 26%; }
.home-locate { top: calc(26% - 60px); }
.hp-panel-bg { background: #F2F1ED; }
.hp-card + .hp-card { margin-top: 4px; }
.hp-first + .hp-panel-bg { padding-top: 4px; }
.hp-first .grabber { width: 48px; height: 4px; background: #B3B3AB; }
.hp-search { margin-top: 16px; height: 56px; border-radius: 16px; background: #F2F1ED; font-size: 20px; font-weight: 600; color: #121210; padding: 0 16px; gap: 16px; }
.hp-recent { height: 56px; font-size: 16px; font-weight: 500; color: #121210; padding-left: 16px; gap: 20px; }
.hp-recent .ic { color: #646464; }
.tile { font-size: 13px; color: #303232; padding: 10px 12px; }
.svc-big { height: 160px; }
.svc-right { grid-template-rows: 76px 76px; }
.svc-row .sq { width: 60px; height: 60px; background: #F2F1ED; }
.svc-row .it { font-size: 12.5px; color: #0E0E0E; gap: 7px; }
.food .f { width: 84px; font-size: 14.5px; }
.food .f .im { height: 65px; background: #F2F1ED; }
.sec-h { font-size: 21px; font-weight: 700; }
.sec-h .go { background: #F2F3EE; }
/* menu metrics */
.dr-prof .av { width: 48px; height: 48px; font-size: 19px; }
.dr-prof b { font-weight: 500; }
.dr-it { height: 44px; font-size: 18px; gap: 20px; padding: 0 20px 0 21px; }
.dr-it .ic { color: #838890; }
.dr-it.sel { background: #F9F9F1; }
.dr-bot .btn { height: 56px; border-radius: 13px; font-size: 19px; font-weight: 500; }
.st-safe { position: absolute; left: 14px; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; background: rgba(255, 255, 255, .94); color: #14213D; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 7px 12px 7px 9px; box-shadow: 0 4px 14px rgba(0, 0, 0, .2); animation: fadeUp .5s var(--e-out) .2s both; }
.st-safe .ic { color: #2F7BF5; }
.st-safe.static { position: relative; left: auto; top: auto; align-self: flex-start; margin-top: 20px; background: rgba(255, 255, 255, .1); color: #fff; box-shadow: none; }
.st-safe.static .ic { color: #8DB4FF; }
.st-chips { position: absolute; left: 14px; top: 12px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.st-chips .st-safe { position: static; }
.st-chips.static { position: relative; left: auto; top: auto; margin-top: 22px; }
.st-rated { display: inline-flex; align-items: center; gap: 8px; background: rgba(18, 20, 23, .78); color: #fff; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 12px 6px 9px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fadeUp .5s var(--e-out) .1s both; }
.st-rated .ss { display: inline-flex; gap: 1px; }
.st-rated.dark { background: rgba(255, 255, 255, .08); }
.st-chips.static .st-safe.static { margin-top: 0; }
.st-last { justify-content: flex-start; }
.tgl { width: 46px; height: 28px; border-radius: 14px; background: #DDDEDF; position: relative; flex: none; }
.tgl:after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform .2s; }
.tgl.on { background: #141414; }
.tgl.on:after { transform: translateX(18px); }

/* ===== DS review pass ===== */
/* lime only on the primary CTA and round actions, one accent per screen */
.impact-card { background: #EFFBB4; }
.impact-card .ic-inner { background: #fff; }
.cap-hero ~ .ip-sec .ip-you { background: #EFFBB4; }
.st-you { background: rgba(255, 255, 255, .08); color: #fff; }
.st-you .c { background: #fff; color: #141414; }
/* text contrast >= 4.5:1 */
.rp-sec h4, .rs-when, .ip-terms, .ip-terms span { color: #6A6B6E !important; }
.ip-chip { color: #141414; background: #E7FFAF; }
.cv-foot, .pn-foot, .pn-ch .t small { color: #5E5F5A; }
.pn-kick { color: #4F6A00; }
/* UI titles Bold 700 / -0.2px; 800 only on brand surfaces */
.ty-head h1 { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.2px; }
.impact-card h2, .ip-title, .ip-big, .ip-facts b { font-weight: 700; letter-spacing: -.2px; }
.ip-sec > h3 { font-weight: 700 !important; letter-spacing: -.2px !important; }
.pg-nav h1 { font-size: 16px; font-weight: 700; }
.st-kick { letter-spacing: 0; }
/* tap targets >= 48pt, no visual change */
.st-top .x, .ty-x, .pg-nav .nb { position: relative; }
.st-top .x::after, .ty-x::after, .pg-nav .nb::after, .x-btn::after { content: ''; position: absolute; inset: -7px; }
.x-btn { position: absolute; }
.homebar.light { background: #fff; }

/* ===== robustness review pass ===== */
:root { color-scheme: light only; }
.desktop .panel { width: auto; }
.rate-sheet { scroll-padding-bottom: calc(var(--safe-bot) + 86px); }
@media (max-height: 700px) {
  .mobile .st-chips.static { display: none; }
  .mobile .st-media { height: 36%; min-height: 120px; }
  .mobile .st-h { font-size: 25px; }
  .mobile .st-steps { margin-top: 16px; gap: 8px; }
  .mobile .st-step { padding: 10px 12px; }
  .mobile .st-goal { margin-top: 14px; padding: 12px 14px; }
  .mobile .st-goal .big { font-size: 26px; }
  .mobile .st-last .st-kick { margin-top: 4px !important; }
  .mobile .st-you { margin-top: 8px; padding: 9px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .nudge { animation: none !important; transform: translateX(-50%); }
  .plus { animation: none !important; }
  .confetti { display: none; }
}

/* ===== hint hand: tap gesture ===== */
.hint-hand { display: none; }
.hint-tap { position: absolute; width: 0; height: 0; pointer-events: none; z-index: 2; }
.hint-tap .hand { position: absolute; left: -23px; top: -13px; width: 48px; height: 48px; overflow: visible; transform-origin: 23px 13px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .3)); animation: tapHand 1.7s ease-in-out infinite; }
.hint-tap .rip { position: absolute; left: -19px; top: -19px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #C1F11D; box-shadow: 0 0 0 1px rgba(20, 20, 20, .12), inset 0 0 0 1px rgba(20, 20, 20, .08); opacity: 0; animation: tapRip 1.7s ease-out infinite; }
.hint-tap .rip.r2 { animation-delay: .22s; }
@keyframes tapHand { 0% { transform: translate(10px, 14px); } 32% { transform: translate(0, 0) scale(1); } 42% { transform: translate(0, 1px) scale(.9); } 56% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10px, 14px); } }
@keyframes tapRip { 0%, 38% { transform: scale(.25); opacity: 0; } 44% { opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hint-tap .hand { animation: none !important; } .hint-tap .rip { display: none; } }
.ip-trans { font-size: 14px; font-style: italic; color: #6A6B6E; margin-top: 4px; }
</style>
</head>

var S = fresh();
var LY = {};
var LAST = { base: null, page: null, overlay: null };
var MODE = null;
var BUSY_UNTIL = 0;

function fresh() { return { step: null, ch: 1, joined: false, count: 0, given: 0, rating: 0, tags: [], comment: '', storyIdx: 0, cap: false, justRated: false, played: false, started: false, history: [] }; }
function snapshot() { var o = {}; for (var k in S) if (k !== 'history') o[k] = Array.isArray(S[k]) ? S[k].slice() : S[k]; return o; }

var CHAPTERS = [
  { n: 1, t: 'First ride', s: 'Rate, join, thank-you page', start: 'c1' },
  { n: 2, t: 'Next ride', s: 'Progress next to the stars', start: 'c2' },
  { n: 3, t: 'Anytime', s: 'Quick rating, menu, program page', start: 'c3' },
  { n: 4, t: 'Goal reached', s: 'The capped fund pays out', start: 'c4' }
];
var ORDER = ['c1', 'arrive', 'sheet', 'story', 'thanks', 'c2', 'ride', 'rideSheet', 'rideDone', 'c3', 'reopen', 'home', 'menu', 'impact', 'c4', 'cap', 'end'];

function preset(ch) {
  S.rating = 0; S.tags = []; S.comment = ''; S.storyIdx = 0; S.justRated = false; S.played = false;
  if (ch === 1) { S.joined = false; S.count = 0; S.given = 0; S.cap = false; }
  if (ch === 2) { S.joined = true; S.count = 4; S.given = 4; S.cap = false; }
  if (ch === 3) { S.joined = true; S.count = 5; S.given = 15; S.cap = false; }
  if (ch === 4) { S.joined = true; S.count = Math.max(S.count, 6); S.given = Math.max(S.given, 16); S.cap = true; }
}
